name: Android debug APK
on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yaml'
  push:
    branches: [work/android-port]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run format:check -- src/mobile README.md package.json .github/workflows/android.yaml
      - run: npm run lint
      - name: Syntax check Android renderer
        run: |
          node --check src/mobile/api.js
          node --check src/mobile/bridge.js
          node --check src/mobile/main.js
          node --check src/mobile/vite.config.js
      - name: Test Android API adapter
        run: npx vitest run src/mobile/api.test.js
      - run: npm run prod
      - run: npm run android:web
      - run: gradle assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: vrcx-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
