name: Android debug APK
on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yaml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to create/update (for example v0.1.0). Leave empty for build only.'
        required: false
        type: string

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run format:check -- src/mobile README.md package.json .github/workflows/android.yaml
      - run: npm run lint
      - name: Syntax check Android renderer
        run: |
          node --check src/mobile/api.js
          node --check src/mobile/bridge.js
          node --check src/mobile/main.js
          node --check src/mobile/vite.config.js
      - name: Test Android API adapter
        run: npx vitest run src/mobile/api.test.js
      - run: npm run prod
      - run: npm run android:web
      - run: gradle assembleDebug --no-daemon
        working-directory: android
      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            VERSION="${{ inputs.release_tag }}"
          else
            VERSION="ci-${GITHUB_SHA::7}"
          fi
          cp "$APK" "dist/VRCX4Android-${VERSION}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: vrcx-android-debug
          path: dist/*.apk

  release:
    needs: debug
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vrcx-android-debug
          path: dist
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading APK."
          else
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --title "VRCX4Android $TAG"               --generate-notes               --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/*.apk             --repo "$GITHUB_REPOSITORY"             --clobber
